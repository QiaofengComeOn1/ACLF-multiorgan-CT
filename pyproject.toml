[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aclf-multiorgan-ct"
version = "0.2.0"
description = "Multi-organ CT analyses for incident ACLF prediction and exploratory imaging clusters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.3.5", "pandas==2.3.1", "scipy==1.16.0", "scikit-learn==1.6.1",
    "joblib==1.5.1", "lifelines==0.30.0", "matplotlib==3.10.3", "openpyxl==3.1.5",
    "statsmodels==0.14.6"
]

[project.optional-dependencies]
benchmark = ["xgboost==3.1.2", "lightgbm==4.6.0", "pygam==0.12.0"]
imaging = ["torch==2.8.0", "torchvision==0.23.0", "timm==1.0.19", "nibabel==5.3.2", "captum>=0.7,<1"]
attribution = ["shap==0.50.0"]

[project.scripts]
aclf-ct = "aclf_ct.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["common_pipeline"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aclf_ct = ["paper_profile.json"]
